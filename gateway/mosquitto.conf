# ============================================================
# Mosquitto 本地开发配置
#
# 安装方式：conda-forge（装在 conda 环境 ai0707 内，免管理员、不碰 UAC）
#   安装：conda install -n ai0707 --override-channels -c conda-forge mosquitto -y
#   产物：D:\soft\anaconda3\envs\ai0707\Library\bin\mosquitto.exe
#
# 启动（前台运行，Ctrl+C 停止）：
#   "D:\soft\anaconda3\envs\ai0707\Library\bin\mosquitto.exe" ^
#       -c "D:\Code\PycharmProjects\AI0707\项目\智能家居AI助手\gateway\mosquitto.conf" -v
#
# 验证：
#   mosquitto_sub -h 127.0.0.1 -p 1883 -t "smart_home/#" -v
#   mosquitto_pub -h 127.0.0.1 -p 1883 -t "smart_home/1/system/heartbeat" -m hello
#
# ⚠️ 这是"本地开发"配置：允许匿名 + 只监听回环地址，
#    仅本机可用、局域网访问不到，所以不需要密码。
# ============================================================

# --- 监听：只绑定回环地址（最安全；将来接 ESP32 时改成 0.0.0.0）---
listener 1883 127.0.0.1

# --- 认证：允许匿名（前提是上面只绑了 127.0.0.1）---
allow_anonymous true

# --- 持久化：retained 消息（如设备 state）重启后不丢 ---
persistence true
persistence_location C:/ProgramData/mosquitto/

# --- 日志：同时输出到控制台和文件，排障看文件 ---
log_dest stdout
log_dest file C:/ProgramData/mosquitto/mosquitto.log
log_type all

# ============================================================
# 【将来改成账号密码认证时，替换上面的 allow_anonymous】
#   allow_anonymous false
#   password_file C:/ProgramData/mosquitto/passwd
#
# 建账号（在 ai0707 环境里执行）：
#   mosquitto_passwd -c C:/ProgramData/mosquitto/passwd smart_home
#   （会提示输入密码；-c 是新建文件，后续加用户去掉 -c）
# ============================================================

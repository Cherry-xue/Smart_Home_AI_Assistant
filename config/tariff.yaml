# ---------------------------------------------------------------------------
# 分时电价（峰 / 平 / 谷）—— 项目级共享配置
#
# 为什么单独放这里，而不是写在 gateway/simulator/device_profiles.yaml 里：
#   电价是【业务规则】，不是【物理参数】。它同时被两处消费——
#     1) 后端落库时给 energy_readings.tariff_period 打标签；
#     2) 能耗 Agent 算"挪到谷电时段能省多少"（确定性代码算，不让模型心算）。
#   放在共享位置，两边读同一份，改电价只需改这里一处。
#
# 时段可跨零点（如 valley 的 21:00-08:00），解析逻辑见 backend/app/core/tariff.py
# ---------------------------------------------------------------------------
timezone: Asia/Shanghai
currency: CNY
unit: kWh

bands:
  - { period: valley, start: "21:00", end: "08:00", price: 0.35 }   # 谷电：晚 21 点至次日 8 点
  - { period: peak,   start: "08:00", end: "11:00", price: 1.20 }   # 峰电：早高峰
  - { period: flat,   start: "11:00", end: "18:00", price: 0.75 }   # 平电：日间
  - { period: peak,   start: "18:00", end: "21:00", price: 1.20 }   # 峰电：晚高峰
